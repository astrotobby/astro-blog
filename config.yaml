# ---------------------------------------------------------------------------
# blog-to-video configuration. Edit this; the code reads it.
# ---------------------------------------------------------------------------

# Wired for astrotobby/astro-blog (verified against the live repo's routing).
posts_dir: "src/content/blog"
post_extensions: [".md", ".mdx"]

# Front-matter of your auto-generated posts: title/description/pubDate/image/tags.
# There is NO slug field, so the URL slug is derived from the filename, slugified
# the same way Astro's glob loader does (see fetch_post.astro_slug).
frontmatter:
  title: "title"
  description: "description"   # falls back to first paragraph if missing
  slug: "slug"                 # absent in your posts -> slugified filename is used
  tags: "tags"

site:
  base_url: "https://astrotobby.site"
  # Astro route is src/pages/blog/[...slug].astro with params.slug = post.id
  post_url_pattern: "{base}/blog/{slug}"
  # Store link woven into captions/descriptions and the end card ("AI Starter Pack").
  products_url: "https://astrotobby.site/products"

# ---- Narration / script ----
script:
  target_seconds: 75           # 1 min+ for stronger watch-time / retention signals
  words_per_minute: 165
  # Rotated per post. {topic} is auto-cleaned into a clause that reads naturally
  # (interrogatives stripped, first letter lower-cased unless an acronym).
  # Short, curiosity-driven, clickbait-style hooks that open a loop the viewer has
  # to keep watching (and click through to the blog) to close.
  hook_styles:
    - "This is the financial secret about {topic} they don't want you to know."
    - "Stop wasting money on old tech — {topic} is the 2026 game changer."
    - "I found a way to automate {topic} for free, and it's absolute magic."
    - "Most creators are failing at {topic} because they're missing this one thing."
    - "Wait until you see how {topic} just disrupted the entire industry."
    - "This is why {topic} is the most profitable skill you can learn in 2026."
    - "I replaced my entire workflow with {topic} and the results are insane."
  # Mid-video PATTERN INTERRUPTS (rotated per post): re-open the curiosity loop at
  # ~40% in — exactly where short-form drop-off peaks. Spoken by the narrator.
  rehooks:
    - "But here's the part most people miss."
    - "Now this is where it actually gets interesting."
    - "And this next part is the reason this video exists."
    - "Here's where almost everyone gets it wrong."
    - "But wait — the real story is what happens next."
  # Short mid-roll CTA (~65% in): plants the blog link while early-scrollers are
  # still watching, without breaking the narration's flow.
  mid_cta: "By the way — the full breakdown is linked below."
  # Curiosity-gap CTA: drives back to the blog AND asks for the follow/subscribe.
  # {sub_or_follow} is filled per platform (YouTube -> "subscribe", else "follow").
  cta: "But that's only the start of the story. Tap the link to read the full breakdown on the blog — and if this opened your eyes, {sub_or_follow} so you never miss the next one."

# ---- Voice (edge-tts). Run `edge-tts --list-voices` to see all, free. ----
# Warm, calm MALE voice to match the male avatar. Alternatives:
#   en-US-GuyNeural (mature/pro), en-US-AndrewNeural (warm), en-GB-RyanNeural (British)
voice:
  name: "en-US-AndrewNeural"   # Warm, engaging male voice for higher retention
  rate: "+0%"                  # natural pace (was +6%) for a calmer delivery
  pitch: "+0Hz"
  # ---- Cloned voice (free OpenVoice v2) — DISABLED: clone quality from the low-fi
  # phone samples wasn't good enough; reverted to the edge-tts voice above. Flip to
  # true (with cleaner reference recordings) to re-enable. ----
  clone: false
  clone_speed: 1.12

# ---- Visuals (free AI image sources: HF FLUX/SDXL -> Picsum -> gradient) ----
visuals:
  # When set, the ENTIRE video is just this one image (gentle Ken Burns) + captions +
  # voiceover — no AI scene montage. Empty "" = normal multi-scene montage (current).
  single_image: ""
  scenes: 15                   # ~5s per visual over a ~75s video = faster pacing for retention
                               # hook every 8-15s window (retention rule of thumb)
  model: "flux"
  # style_suffix is now ONLY used as a fallback for any post that bypasses build_script.make_scenes().
  # The main cinematic scene logic in build_script.py uses topic-specific visual profiles
  # (TOPIC_VISUAL_PROFILES) and scene-type modifiers instead of this single global suffix.
  style_suffix: "epic cinematic key art, dramatic volumetric lighting, ultra detailed, vibrant, film grain, professional motion graphic, 9:16"
  width: 1080
  height: 1920

video:
  fps: 30
  vertical: { w: 1080, h: 1920 }   # Reels/Shorts/TikTok
  horizontal: { w: 1920, h: 1080 } # YouTube main
  make_horizontal: true
  captions: true                    # burn-in subtitles (huge for retention)
  caption_margin_v: 70              # margin from the BOTTOM (captions are bottom-aligned)
  music: true
  music_volume: 0.12
  # ---- Cinematic overlays (drawtext, all free/in-ffmpeg) ----
  hook_card: true                   # burn the hook as a big title card over the first ~2.8s
  data_lower_third: true            # show extracted stat/number as a lower-third bar on DATA scenes
  end_card: true                    # dimmed CTA card over the last ~3.4s of the video
  end_card_lines:                   # rendered top-to-bottom, auto-sized per aspect
    - "READ THE FULL BREAKDOWN"
    - "astrotobby.site"
    - "AI STARTER PACK → /products"

# ---- Talking avatar (Wav2Lip, runs inside the GitHub runner — no external Space) ----
# Needs the HF_TOKEN secret (to download weights) + an avatar image at the path below.
# If Wav2Lip setup/inference fails, the render falls back to the image montage.
# The avatar is composited as a NON-circular, soft-feathered head-and-shoulders
# figure that blends into the scene (no hard bubble/ring) and gently bobs in sync
# with the motion so it reads as a live presenter rather than a pasted-on circle.
avatar:
  enabled: false                   # avatar removed — video is montage + captions only
  image: "assets/avatar.png"       # still fallback if no motion clip is present
  # ---- OPTIONAL: a short looping clip of your avatar already MOVING (head/hands/
  # gestures/expressions). Wav2Lip overlays real lip-sync onto this footage and loops
  # it to cover the whole voiceover, so the figure gets genuine motion AND correct lips.
  # Make one free, once (see BLOG-TO-VIDEO.md "Living avatar"), then drop it here.
  # If the file is absent, the pipeline cleanly falls back to the still image above.
  motion_video: "assets/avatar_motion.mp4"
  # ---- Mask the source clip's tool watermark with your brand logo (applied to the
  # motion clip BEFORE lip-sync, so the cover-up travels with the avatar). Optional:
  # if watermark_logo is absent the clip is used unmasked.
  watermark_logo: ""               # empty = no logo overlay (current clip has no watermark)
  watermark_pos: "bottom-right"    # corner where a source watermark would sit (if re-enabled)
  watermark_scale: 0.42            # logo width as a fraction of the clip width (grow to fully cover)
  watermark_margin: 0.0            # gap from the corner edges (fraction of clip width; 0 = flush)
  timeout: 1900                    # max seconds for Wav2Lip CPU inference (full 1min+ voiceover)
  # ---- integrated, feathered figure (lower-right, over the moving montage) ----
  bubble_frac: 0.56                # figure HEIGHT as a fraction of video height
  bubble_aspect: 0.75              # figure width / height (matches the 720x958 source,
                                   # so the presenter clip is shown nearly uncropped)
  # Play the base clip forward-then-reverse on a loop so the avatar motion is CONTINUOUS
  # across the whole voiceover (no jarring jump back to frame 1 every few seconds).
  seamless_loop: true
  bubble_margin: 0.04              # gap from the right edge (fraction of height)
  bubble_bottom: 0.16              # gap from the bottom (leaves room for bottom captions)
  feather: 0.10                    # soft-edge blend amount (fraction of figure short side)
  bob_px: 9                        # subtle vertical sway (px) so the figure feels alive
  bob_x_px: 5                      # subtle horizontal sway (px)
  # Light crop only — keep the FULL presenter (head, shoulders, hand gestures). A small
  # inset (zoom 0.98) also trims any thin corner watermark off the source clip.
  face_zoom: 0.98                  # crop width as fraction of the shorter dimension
  face_cx: 0.5                     # face centre X (0=left, 1=right)
  face_cy: 0.48                    # face centre Y (0=top, 1=bottom)

# ---- Posting rules / anti-ban caps (see HONEST-LIMITS.md) ----
platforms:
  # Also cross-post each video to Instagram + Facebook STORIES (uses a <=58s trimmed
  # cut of the vertical, since Stories APIs reject clips over ~60s). NOTE: TikTok has
  # NO Stories API, so TikTok only ever gets the normal feed/inbox post.
  also_story: true
  youtube:
    enabled: true
    also_short: false          # true only if <=3 posts/day
    category_id: "22"          # People & Blogs; 27=Education, 28=Tech
    privacy: "public"
  # Direct official-API posters (no server). Add creds in .env / GitHub secrets
  # to activate each platform. All listed platforms post directly via their APIs
  # without requiring a self-hosted Postiz server:
  #   facebook  -> Graph API (needs FACEBOOK_PAGE_ID + FACEBOOK_PAGE_TOKEN)
  #   instagram -> Graph API (needs INSTAGRAM_ACCESS_TOKEN + INSTAGRAM_ACCOUNT_ID)
  #   threads   -> Threads API (needs THREADS_ACCESS_TOKEN + THREADS_ACCOUNT_ID)
  #   tiktok    -> TikTok Content Posting API
  #   x         -> X API v2 (free tier caps at ~500 writes/month)
  #   rumble    -> headless browser upload (needs RUMBLE_EMAIL + RUMBLE_PASSWORD)
  #   pinterest -> Pinterest API (needs PINTEREST_ACCESS_TOKEN + PINTEREST_BOARD_ID)
  direct: [x, facebook, instagram, threads, tiktok, rumble, pinterest]
  # Rumble has NO upload API -> the poster drives the real upload page with a
  # headless browser (Playwright). Needs RUMBLE_EMAIL + RUMBLE_PASSWORD secrets and
  # 2FA OFF on that account. visibility: public | unlisted | private.
  rumble:
    visibility: "public"            # public | unlisted | private
    # Rumble REQUIRES a primary category. Top-level options: Automotive, Cooking,
    # Entertainment, Finance & Crypto, Gaming, Health & Science, HowTo, Music, News,
    # Podcasts, Sports, Technology, Travel, Viral, Vlogs. Blog niche = AI/tech.
    primary_category: "Technology"

  # Pinterest: pins the post hero image linking back to the blog post.
  # Needs PINTEREST_ACCESS_TOKEN + PINTEREST_BOARD_ID secrets in GitHub.
  # Get a token: https://developers.pinterest.com/apps/ -> create app -> OAuth -> get access token
  # Get board_id: open your board on Pinterest, the ID is in the URL (last numeric segment).
  pinterest:
    board_id: ""   # override with PINTEREST_BOARD_ID secret; leave blank to use only the secret

tumblr:
  blog: ""                 # your blog host, e.g. "astrotobby.tumblr.com" (TUMBLR_BLOG also works)
limits:
  x_per_day: 3
  reddit_per_day: 1
  reddit_enabled: false        # OFF by default — see HONEST-LIMITS.md
  reddit_subreddits: []        # e.g. ["CryptoCurrency"] — only subs that allow self-promo

hashtags:
  base: ["#crypto", "#GameFi", "#web3", "#AInews"]
  max: 8
