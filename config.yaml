# ---------------------------------------------------------------------------
# blog-to-video configuration. Edit this; the code reads it.
# ---------------------------------------------------------------------------

# Wired for astrotobby/astro-blog (verified against the live repo's routing).
posts_dir: "src/content/blog"
post_extensions: [".md", ".mdx"]

# Front-matter of your auto-generated posts: title/description/pubDate/image/tags.
# There is NO slug field, so the URL slug is derived from the filename, slugified
# the same way Astro's glob loader does (see fetch_post.astro_slug).
frontmatter:
  title: "title"
  description: "description"   # falls back to first paragraph if missing
  slug: "slug"                 # absent in your posts -> slugified filename is used
  tags: "tags"

site:
  base_url: "https://astrotobby.site"
  # Astro route is src/pages/blog/[...slug].astro with params.slug = post.id
  post_url_pattern: "{base}/blog/{slug}"

# ---- Narration / script ----
script:
  target_seconds: 75           # 1 min+ for stronger watch-time / retention signals
  words_per_minute: 165
  # Rotated per post. {topic} is auto-cleaned into a clause that reads naturally
  # (interrogatives stripped, first letter lower-cased unless an acronym).
  # Short, curiosity-driven, clickbait-style hooks that open a loop the viewer has
  # to keep watching (and click through to the blog) to close.
  hook_styles:
    - "The truth about {topic} that nobody's telling you."
    - "Stop scrolling — {topic} just changed everything."
    - "You won't believe what {topic} really means."
    - "Most people get {topic} dangerously wrong."
    - "What they're not telling you about {topic}."
    - "This is why everyone's suddenly talking about {topic}."
    - "{topic} is about to break the internet — here's why."
  # Curiosity-gap CTA: drives back to the blog AND asks for the follow/subscribe.
  # {sub_or_follow} is filled per platform (YouTube -> "subscribe", else "follow").
  cta: "But that's only the start of the story. Tap the link to read the full breakdown on the blog — and if this opened your eyes, {sub_or_follow} so you never miss the next one."

# ---- Voice (edge-tts). Run `edge-tts --list-voices` to see all, free. ----
# Warm, calm MALE voice to match the male avatar. Alternatives:
#   en-US-GuyNeural (mature/pro), en-US-AndrewNeural (warm), en-GB-RyanNeural (British)
voice:
  name: "en-US-BrianNeural"    # edge-tts fallback voice (used if cloning is off/unavailable)
  rate: "+0%"                  # natural pace (was +6%) for a calmer delivery
  pitch: "+0Hz"
  # ---- Cloned voice (free OpenVoice v2) — DISABLED: clone quality from the low-fi
  # phone samples wasn't good enough; reverted to the edge-tts voice above. Flip to
  # true (with cleaner reference recordings) to re-enable. ----
  clone: false
  clone_speed: 1.12

# ---- Visuals (free AI image sources: HF FLUX/SDXL -> Picsum -> gradient) ----
visuals:
  scenes: 8                    # more scenes over a ~75s video = faster cuts, higher retention
  model: "flux"
  style_suffix: "epic cinematic key art, dramatic volumetric lighting, ultra detailed, vibrant, film grain, professional motion graphic, 9:16"
  width: 1080
  height: 1920

video:
  fps: 30
  vertical: { w: 1080, h: 1920 }   # Reels/Shorts/TikTok
  horizontal: { w: 1920, h: 1080 } # YouTube main
  make_horizontal: true
  captions: true                    # burn-in subtitles (huge for retention)
  caption_margin_v: 70              # margin from the BOTTOM (captions are bottom-aligned)
  music: true
  music_volume: 0.12

# ---- Talking avatar (Wav2Lip, runs inside the GitHub runner — no external Space) ----
# Needs the HF_TOKEN secret (to download weights) + an avatar image at the path below.
# If Wav2Lip setup/inference fails, the render falls back to the image montage.
# The avatar is composited as a NON-circular, soft-feathered head-and-shoulders
# figure that blends into the scene (no hard bubble/ring) and gently bobs in sync
# with the motion so it reads as a live presenter rather than a pasted-on circle.
avatar:
  enabled: true
  image: "assets/avatar.png"
  timeout: 1500                    # max seconds for Wav2Lip CPU inference (full 1min+ voiceover)
  # ---- integrated, feathered figure (lower-right, over the moving montage) ----
  bubble_frac: 0.52                # figure HEIGHT as a fraction of video height
  bubble_aspect: 0.72              # figure width / height (portrait head-and-shoulders)
  bubble_margin: 0.04              # gap from the right edge (fraction of height)
  bubble_bottom: 0.16              # gap from the bottom (leaves room for bottom captions)
  feather: 0.10                    # soft-edge blend amount (fraction of figure short side)
  bob_px: 9                        # subtle vertical sway (px) so the figure feels alive
  bob_x_px: 5                      # subtle horizontal sway (px)
  # head-and-shoulders crop (wider than a face close-up so it looks inclusive, not boxed):
  face_zoom: 0.92                  # crop width as fraction of the shorter dimension
  face_cx: 0.5                     # face centre X (0=left, 1=right)
  face_cy: 0.42                    # face centre Y (0=top, 1=bottom)

# ---- Posting rules / anti-ban caps (see HONEST-LIMITS.md) ----
platforms:
  youtube:
    enabled: true
    also_short: false          # true only if <=3 posts/day
    category_id: "22"          # People & Blogs; 27=Education, 28=Tech
    privacy: "public"
  # Direct official-API posters (no server). Only platforms WITHOUT an app-review
  # gate are automated now. Add creds in .env / GitHub secrets to activate each.
  #   tumblr -> no review | x -> capped below | reddit -> opt-in + capped (off by default)
  # Instagram/Facebook/LinkedIn/Pinterest are deferred (need their own dev apps);
  # the workflow saves the rendered Reels as artifacts for hand-upload meanwhile.
  # X stays configured (keys in GitHub secrets, code ready). It currently soft-fails
  # with 402 "no credits" because X's API requires a paid tier — it will START
  # POSTING automatically once you subscribe to a paid X plan. No code change needed.
  direct: [x, facebook, instagram, threads]   # tumblr removed; add "reddit" per HONEST-LIMITS.md

tumblr:
  blog: ""                 # your blog host, e.g. "astrotobby.tumblr.com" (TUMBLR_BLOG also works)
limits:
  x_per_day: 3
  reddit_per_day: 1
  reddit_enabled: false        # OFF by default — see HONEST-LIMITS.md
  reddit_subreddits: []        # e.g. ["CryptoCurrency"] — only subs that allow self-promo

hashtags:
  base: ["#crypto", "#GameFi", "#web3", "#AInews"]
  max: 8
