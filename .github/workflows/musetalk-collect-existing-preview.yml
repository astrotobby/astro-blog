name: Retrieve completed MuseTalk preview

on:
  # Manual-only: do not create extra Kaggle API requests on code edits.
  workflow_dispatch:
    inputs:
      kernel_ref:
        description: "Existing completed Kaggle kernel (owner/slug)"
        required: true
        default: "astrotobby/musetalk-preview-45767212996"
        type: string

concurrency:
  group: completed-musetalk-output-retrieval
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  retrieve:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out downloader script
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Kaggle CLI and MP4 validator
        run: |
          python -m pip install --disable-pip-version-check "kaggle==2.2.5" requests six "av>=12,<17"

      - name: Download only the MuseTalk render (not model files or samples)
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KERNEL_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.kernel_ref || 'astrotobby/musetalk-preview-45767212996' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${KAGGLE_API_TOKEN:-}" ]]; then
            echo "::error::Missing KAGGLE_API_TOKEN secret."
            exit 1
          fi

          STATUS=""
          for attempt in 1 2 3 4; do
            if STATUS="$(kaggle kernels status "$KERNEL_REF" 2>&1)"; then
              break
            fi
            if ! grep -Eqi '429|too many requests|rate.?limit' <<< "$STATUS"; then
              echo "$STATUS"
              exit 1
            fi
            delay=$((60 * (2 ** (attempt - 1))))
            (( delay > 300 )) && delay=300
            echo "Kaggle status API rate-limited; retry $attempt/4 in $delay seconds."
            sleep "$delay"
          done
          if [[ -z "$STATUS" ]]; then
            echo "::error::Kaggle status API remained rate-limited after retries."
            exit 1
          fi
          echo "Existing Kaggle kernel status: $STATUS"
          if ! grep -Eqi 'complete' <<< "$STATUS"; then
            echo "::error::The selected Kaggle kernel is not complete; refusing to download partial output."
            if grep -Eqi 'error|failed|cancelled' <<< "$STATUS"; then
              kaggle kernels logs "$KERNEL_REF" || true
            fi
            exit 1
          fi

          mkdir -p preview-output
          # Prefer Kaggle MCP session output listing, which can return a signed URL
          # without the separate kernels.get permission that this token lacks.
          OUTPUT_READY=0
          if python scripts/kaggle_mcp_download_output.py --kernel-ref "$KERNEL_REF" --file-path "musetalk_preview.mp4" --output "preview-output/musetalk_preview.mp4"; then
            OUTPUT_READY=1
          else
            MCP_EXIT=$?
            echo "Kaggle MCP exact-file retrieval unavailable (exit $MCP_EXIT); falling back to the official CLI."
          fi
          if [[ "$OUTPUT_READY" -ne 1 ]]; then
            for attempt in 1 2; do
              if [[ "$attempt" -eq 1 ]]; then delay=180; else delay=300; fi
              echo "Waiting ${delay}s before Kaggle CLI output request (attempt ${attempt}/2)."
              sleep "$delay"
              OUTPUT_LOG="preview-output/kaggle-output-attempt-$attempt.log"
              if kaggle kernels output "$KERNEL_REF" --path preview-output --file-pattern ".*(musetalk_preview|presenter_narration)[.]mp4$" --page-size 200 >"$OUTPUT_LOG" 2>&1; then
                cat "$OUTPUT_LOG"
                OUTPUT_READY=1
                break
              fi
              cat "$OUTPUT_LOG"
              if ! grep -Eqi "429|too many requests|rate.?limit" "$OUTPUT_LOG"; then
                break
              fi
            done
          fi
          if [[ "$OUTPUT_READY" -ne 1 ]]; then
            echo "::warning::Inference completed successfully, but the separate MP4 download endpoint is still unavailable."
            {
              echo "## MuseTalk inference completed — output download unavailable"
              echo
              echo "The private Kaggle kernel reached COMPLETE; inference was not repeated."
              echo
              echo "Play the output in the private Kaggle notebook: https://www.kaggle.com/code/$KERNEL_REF"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ ! -s preview-output/musetalk_preview.mp4 ]]; then
            mapfile -t CANDIDATES < <(find preview-output -type f \( -name "musetalk_preview.mp4" -o -name "presenter_narration.mp4" \) -size +100k | sort)
            if [[ "${#CANDIDATES[@]}" -ne 1 ]]; then
              echo "::warning::Kaggle returned an unexpected number of MP4 files; leaving the completed notebook available for playback."
              exit 0
            fi
            cp "${CANDIDATES[0]}" preview-output/musetalk_preview.mp4
          fi

          PREVIEW="$(find preview-output -type f -name 'musetalk_preview.mp4' -size +100k -print -quit)"
          if [[ -z "$PREVIEW" ]]; then
            mapfile -t LEGACY < <(find preview-output -type f -name 'presenter_narration.mp4' -size +100k | sort)
            if [[ "${#LEGACY[@]}" -ne 1 ]]; then
              echo "::error::Expected one MuseTalk render (musetalk_preview.mp4 or presenter_narration.mp4); found ${#LEGACY[@]} legacy candidate(s)."
              find preview-output -maxdepth 5 -type f -printf '%p (%s bytes)\\n' | head -50
              exit 1
            fi
            cp "${LEGACY[0]}" preview-output/musetalk_preview.mp4
          fi

          OUTPUT_MP4=preview-output/musetalk_preview.mp4
          python - "$OUTPUT_MP4" <<'PY'
          import av
          import json
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          size = path.stat().st_size
          with av.open(str(path)) as container:
              stream_types = {stream.type for stream in container.streams}
              duration = (
                  float(container.duration / av.time_base)
                  if container.duration is not None
                  else max(
                      (float(stream.duration * stream.time_base)
                       for stream in container.streams if stream.duration is not None),
                      default=0.0,
                  )
              )
          if size < 100_000 or duration < 2 or duration > 30:
              raise SystemExit(f"Invalid preview size/duration: {size} bytes, {duration:.2f}s")
          if not {"video", "audio"}.issubset(stream_types):
              raise SystemExit(
                  f"Preview must contain both audio and video streams; found {sorted(stream_types)}"
              )
          print(json.dumps({
              "file": str(path),
              "bytes": size,
              "duration_seconds": duration,
              "streams": sorted(stream_types),
          }, indent=2))
          PY

          {
            echo "## MuseTalk preview validated"
            echo
            echo "The verified preview remains in the private Kaggle notebook output:"
            echo
            echo "https://www.kaggle.com/code/$KERNEL_REF"
            echo
            echo "No presenter video or audio was uploaded to this public GitHub repository or a GitHub Actions artifact."
          } >> "$GITHUB_STEP_SUMMARY"
