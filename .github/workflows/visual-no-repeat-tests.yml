name: Visual no-repeat regression tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout astro-blog
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install minimal renderer test dependencies
        run: python -m pip install --disable-pip-version-check requests PyYAML Pillow

      - name: Compile renderer and duplicate-history scripts
        run: python -m py_compile scripts/generate_video.py scripts/build_script.py scripts/seed_footage_history.py scripts/repair_longform_visuals.py scripts/create_longform_social_release.py scripts/longform_social_bridge.py scripts/platforms.py scripts/longform_pipeline.py scripts/test_video_pipeline.py

      - name: Run visual duplicate guard tests
        run: python -m unittest scripts.test_video_pipeline.VisualDuplicateGuardTests -v
