name: Cancel obsolete MuseTalk retrieval attempts

on:
  # Manual-only maintenance utility.
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cancel-obsolete-retrievals:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Cancel only superseded retrieval attempts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          runs=(
            45775458525
            45774854830
            45774586995
            45773999660
            45773543030
            45772641813
          )
          for run_id in "${runs[@]}"; do
            echo "Cancelling obsolete MuseTalk retrieval run ${run_id}"
            if gh api --silent --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel"; then
              echo "Cancellation requested for ${run_id}"
            else
              echo "Run ${run_id} was already completed or not cancellable."
            fi
          done
          echo "Verifying final states:"
          for run_id in "${runs[@]}"; do
            gh run view "${run_id}" --repo "${GITHUB_REPOSITORY}" --json status,conclusion
          done

          echo "Starting one replacement retrieval using the updated downloader and capped retry policy."
          gh workflow run musetalk-collect-existing-preview.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main \
            -f kernel_ref=astrotobby/musetalk-preview-45767212996
