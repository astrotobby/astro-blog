name: Sync Labs CPU-only integration tests

on:
  pull_request:
    paths:
      - "scripts/influencer.py"
      - "scripts/sync_labs_*.py"
      - "scripts/test_sync_labs_integration.py"
      - "config.yaml"
      - ".github/workflows/sync-labs-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-labs-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out influencer pipeline
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check requests PyYAML

      - name: Compile managed Sync-3 integration
        run: |
          python -m py_compile scripts/influencer.py scripts/sync_labs_lipsync.py scripts/sync_labs_smoke_test.py scripts/test_sync_labs_integration.py

      - name: Run CPU-only budget and media-preparation tests
        run: python scripts/test_sync_labs_integration.py
