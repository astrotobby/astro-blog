name: validate-youtube-channels

# Manual, read-only credential check. This workflow never uploads or changes channel content.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install YouTube API client
        run: python -m pip install --quiet google-api-python-client google-auth google-auth-httplib2

      - name: Verify channel-specific authorizations (no uploads)
        env:
          # Shared client credentials: use Secrets first, with Variables as compatibility fallback.
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID || vars.YOUTUBE_CLIENT_ID || secrets.CLIENT_ID || vars.CLIENT_ID || secrets.YOUTUBECLIENT_ID || vars.YOUTUBECLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET || secrets.YOUTUBE_SECRET_KEY || vars.YOUTUBE_CLIENT_SECRET || vars.YOUTUBE_SECRET_KEY }}
          CLIENT_ID: ${{ secrets.CLIENT_ID || vars.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET || vars.CLIENT_SECRET }}
          YOUTUBECLIENT_ID: ${{ secrets.YOUTUBECLIENT_ID || vars.YOUTUBECLIENT_ID }}
          YOUTUBECLIENT_SECTRET: ${{ secrets.YOUTUBECLIENT_SECTRET || vars.YOUTUBECLIENT_SECTRET || secrets.YOUTUBECLIENT_SECRET || vars.YOUTUBECLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN_DIGITAL_NOMAD: ${{ secrets.YOUTUBE_REFRESH_TOKEN_DIJITOL_NOMAD || vars.YOUTUBE_REFRESH_TOKEN_DIJITOL_NOMAD || secrets.REFRESHTOKEN_DIJITOLNOMAD || vars.REFRESHTOKEN_DIJITOLNOMAD || secrets.YOUTUBE_REFRESH_TOKEN_DIGITAL_NOMAD || vars.YOUTUBE_REFRESH_TOKEN_DIGITAL_NOMAD }}
          YOUTUBE_REFRESH_TOKEN_ASTROTOBBYC: ${{ secrets.YOUTUBE_REFRESH_TOKEN_ASTRO_TOBBY || vars.YOUTUBE_REFRESH_TOKEN_ASTRO_TOBBY || secrets.YOUTUBE_REFRESH_TOKEN_ASTROTOBBYC || vars.YOUTUBE_REFRESH_TOKEN_ASTROTOBBYC }}
          YOUTUBE_CHANNEL_ID_DIGITAL_NOMAD: ${{ vars.YOUTUBE_CHANNEL_ID_DIGITAL_NOMAD || secrets.YOUTUBE_CHANNEL_ID_DIGITAL_NOMAD }}
          YOUTUBE_CHANNEL_ID_ASTROTOBBYC: ${{ vars.YOUTUBE_CHANNEL_ID_ASTROTOBBYC || secrets.YOUTUBE_CHANNEL_ID_ASTROTOBBYC }}
        run: python scripts/validate_youtube_channels.py
