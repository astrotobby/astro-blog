name: refresh-ig-token

# Self-renewing Instagram token: refresh daily and keep the new token in the shared
# pipeline state cache. No PAT, no secret writes, no manual upkeep. The daily run also
# keeps the cache warm (GitHub evicts caches unused for 7 days), so the chain is forever.
on:
  schedule:
    - cron: "0 4 * * *"   # every day at 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

# Share the pipeline's lock + state cache so the refresh and the posting runs never
# race on the cached token/ledger.
concurrency:
  group: blog-to-video
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore pipeline state
        uses: actions/cache@v4
        with:
          path: .pipeline/state
          key: blog2video-state-${{ github.run_id }}
          restore-keys: |
            blog2video-state-
      - name: Refresh Instagram token
        env:
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}   # seed / first-run fallback only
        run: python scripts/refresh_ig_token.py
