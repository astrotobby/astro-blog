name: refresh-ig-token

# Self-renewing Instagram token: refresh daily and keep the new token in the shared
# pipeline state cache. No PAT, no secret writes, no manual upkeep. The daily run also
# keeps the cache warm (GitHub evicts caches unused for 7 days), so the chain is forever.
on:
  schedule:
    - cron: "0 4 * * *"   # every day at 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

# Share the pipeline's lock + state cache so the refresh and the posting runs never
# race on the cached token/ledger.
concurrency:
  group: blog-to-video
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore pipeline state
        uses: actions/cache@v4
        with:
          path: .pipeline/state
          key: blog2video-state-${{ github.run_id }}
          restore-keys: |
            blog2video-state-
      - name: Refresh Instagram token
        env:
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}   # seed / first-run fallback only
        run: python scripts/refresh_ig_token.py
      # Same self-renewing idea for Threads (60-day token) and Pinterest (30-day token).
      - name: Refresh Threads and Pinterest tokens
        if: always()
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
        run: python scripts/refresh_social_tokens.py
      # Check every posting login without posting; Telegram alert + red run if one died
      # (e.g. after a password change), so it gets fixed before the next post fails.
      - name: Check posting credentials
        if: always()
        env:
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET || secrets.YOUTUBE_SECRET_KEY }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAN_BOT }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || secrets.TELCHAT_ID }}
        run: python scripts/token_health.py
