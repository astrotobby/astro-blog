name: Recover completed private MuseTalk preview

on:
  push:
    paths:
      - '.github/workflows/recover-musetalk-preview.yml'
  workflow_dispatch:
    inputs:
      kernel_id:
        description: Completed Kaggle kernel ID (owner/name)
        required: true
        default: astrotobby/musetalk-preview-45816547632
        type: string
      expected_seconds:
        description: Expected preview length, seconds (approx)
        required: true
        default: "4.6"
        type: string

permissions:
  contents: read

concurrency:
  group: musetalk-preview-recovery
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Kaggle CLI and MP4 parser
        run: python -m pip install --disable-pip-version-check --upgrade kaggle six av
      - name: Download the finished session MP4 once after cooldown
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KERNEL_ID: ${{ inputs.kernel_id || 'astrotobby/musetalk-preview-45816547632' }}
          EXPECTED_SECONDS: ${{ inputs.expected_seconds || '4.6' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovered-preview
          echo "Allowing Kaggle's output endpoint cooldown before one targeted download."
          sleep 120
          echo "Requesting only the completed MuseTalk MP4."
          timeout 90s kaggle kernels output "$KERNEL_ID" \
            --path recovered-preview \
            --file-pattern '(^|/)musetalk_preview[.]mp4$' \
            --page-size 100
          python - <<'PY'
          import av, json, os, pathlib, shutil
          root = pathlib.Path("recovered-preview")
          matches = list(root.rglob("musetalk_preview.mp4"))
          if not matches:
              matches = [p for p in root.rglob("*.mp4") if p.is_file()]
          if not matches:
              raise SystemExit("Kaggle completed without placing an MP4 in the recovery folder.")
          source = max(matches, key=lambda p: p.stat().st_size)
          target = root / "musetalk_preview.mp4"
          if source.resolve() != target.resolve():
              shutil.copy2(source, target)
          size = target.stat().st_size
          if size < 100_000:
              raise SystemExit(f"Downloaded output is too small: {size} bytes.")
          media = av.open(str(target))
          streams = {stream.type for stream in media.streams}
          duration = float(media.duration) / av.time_base if media.duration else 0.0
          expected = float(os.environ["EXPECTED_SECONDS"])
          if not {"video", "audio"}.issubset(streams):
              raise SystemExit(f"Preview requires audio and video; found {sorted(streams)}.")
          if not expected - 1.5 <= duration <= expected + 3.0:
              raise SystemExit(f"Unexpected preview duration {duration:.3f}s.")
          video = next(s for s in media.streams if s.type == "video")
          audio = next(s for s in media.streams if s.type == "audio")
          summary = {
              "file": target.name,
              "bytes": size,
              "duration_seconds": round(duration, 3),
              "streams": sorted(streams),
              "video_codec": video.codec_context.name,
              "audio_codec": audio.codec_context.name,
              "resolution": f"{video.width}x{video.height}",
              "source_kernel": os.environ["KERNEL_ID"],
          }
          (root / "preview-summary.json").write_text(json.dumps(summary, indent=2))
          print(json.dumps(summary, indent=2))
          PY
      - name: Upload the real MP4 for review
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: muse-talk-private-quality-preview
          path: recovered-preview/musetalk_preview.mp4
          if-no-files-found: error
          retention-days: 7
