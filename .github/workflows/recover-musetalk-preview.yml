name: Recover completed private MuseTalk preview

on:
  push:
    paths:
      - '.github/workflows/recover-musetalk-preview.yml'
  workflow_dispatch:
    inputs:
      kernel_id:
        description: Completed Kaggle kernel ID (owner/name)
        required: true
        default: astrotobby/musetalk-preview-45816547632
        type: string
      expected_seconds:
        description: Expected preview length, seconds (approx)
        required: true
        default: "4.6"
        type: string

permissions:
  contents: read

concurrency:
  group: musetalk-preview-recovery
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Kaggle CLI and MP4 parser
        run: python -m pip install --disable-pip-version-check --upgrade kaggle six av
      - name: Download and validate the completed MuseTalk MP4
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KERNEL_ID: ${{ inputs.kernel_id || 'astrotobby/musetalk-preview-45816547632' }}
          EXPECTED_SECONDS: ${{ inputs.expected_seconds || '4.6' }}
        shell: bash
        run: |
          set -euo pipefail
          # Current KGAT_ tokens use KAGGLE_API_TOKEN. A pre-KGAT legacy API
          # key must instead be paired with the Kaggle username as KAGGLE_KEY.
          if [[ -n "${KAGGLE_API_TOKEN:-}" && "$KAGGLE_API_TOKEN" != KGAT_* ]]; then
            export KAGGLE_USERNAME="astrotobby"
            export KAGGLE_KEY="$KAGGLE_API_TOKEN"
            unset KAGGLE_API_TOKEN
            echo "Using legacy Kaggle API-key authentication."
          else
            echo "Using current Kaggle access-token authentication."
          fi
          mkdir -p recovered-preview
          echo "Retrieving only the already-rendered MuseTalk MP4 from $KERNEL_ID."
          downloaded=0
          for attempt in 1 2 3; do
            rm -f recovered-preview/musetalk_preview.mp4
            if kaggle kernels output "$KERNEL_ID" \
              --path recovered-preview \
              --file-pattern '(^|/)musetalk_preview[.]mp4$' \
              --page-size 1 > recovered-preview/download-attempt-$attempt.log 2>&1; then
              cat recovered-preview/download-attempt-$attempt.log
              if [ -s recovered-preview/musetalk_preview.mp4 ]; then
                downloaded=1
                break
              fi
            else
              cat recovered-preview/download-attempt-$attempt.log
            fi
            sleep $((attempt * 15))
          done
          if [ "$downloaded" -ne 1 ]; then
            echo "::error::Kaggle CLI did not return the completed MuseTalk MP4."
            exit 1
          fi
          python - <<'PY'
          import av, json, pathlib, os
          p = pathlib.Path("recovered-preview/musetalk_preview.mp4")
          size = p.stat().st_size
          expected = float(os.environ["EXPECTED_SECONDS"])
          if size < 100_000:
              raise SystemExit(f"Preview is too small: {size} bytes.")
          container = av.open(str(p))
          stream_types = {stream.type for stream in container.streams}
          duration = (float(container.duration) / av.time_base) if container.duration is not None else 0.0
          if not {"video", "audio"}.issubset(stream_types):
              raise SystemExit(f"Preview needs both audio and video; got {sorted(stream_types)}.")
          if not expected - 1.5 <= duration <= expected + 3.0:
              raise SystemExit(f"Unexpected preview duration {duration:.2f}s; expected about {expected:.2f}s.")
          video = next(s for s in container.streams if s.type == "video")
          audio = next(s for s in container.streams if s.type == "audio")
          summary = {
              "file": p.name, "bytes": size, "duration_seconds": duration,
              "streams": sorted(stream_types),
              "video_codec": video.codec_context.name,
              "audio_codec": audio.codec_context.name,
              "resolution": f"{video.width}x{video.height}"
          }
          pathlib.Path("recovered-preview/preview-summary.json").write_text(json.dumps(summary, indent=2))
          print(json.dumps(summary, indent=2))
          PY
      - name: Preserve the private preview for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: muse-talk-private-quality-preview
          path: recovered-preview/
          if-no-files-found: ignore
          retention-days: 7
      - name: Write recovery summary
        if: always()
        run: |
          {
            echo "## MuseTalk completed preview recovery"
            echo "The MP4 is provided as a private workflow artifact for review."
          } >> "$GITHUB_STEP_SUMMARY"
