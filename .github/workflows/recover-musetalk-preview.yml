name: Recover completed private MuseTalk preview

on:
  push:
    paths:
      - '.github/workflows/recover-musetalk-preview.yml'
  workflow_dispatch:
    inputs:
      kernel_id:
        description: Completed Kaggle kernel ID (owner/name)
        required: true
        default: astrotobby/musetalk-preview-45816547632
        type: string
      expected_seconds:
        description: Expected preview length, seconds (approx)
        required: true
        default: "4.6"
        type: string

permissions:
  contents: read

concurrency:
  group: musetalk-preview-recovery
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install MP4 parser and HTTP client
        run: python -m pip install --disable-pip-version-check --upgrade requests av
      - name: Download exact completed MP4 using Kaggle output endpoint
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KERNEL_ID: ${{ inputs.kernel_id || 'astrotobby/musetalk-preview-45816547632' }}
          EXPECTED_SECONDS: ${{ inputs.expected_seconds || '4.6' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovered-preview
          python - <<'PY'
          import json, os, pathlib, requests, av, re, sys

          token = os.environ["KAGGLE_API_TOKEN"]
          owner, slug = os.environ["KERNEL_ID"].split("/", 1)
          expected = float(os.environ["EXPECTED_SECONDS"])
          base = "https://api.kaggle.com/v1/kernels.KernelsApiService"
          headers = {
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json",
              "Accept": "application/json",
          }
          session = requests.Session()

          def post(method, payload):
              response = session.post(
                  f"{base}/{method}",
                  headers=headers,
                  json=payload,
                  timeout=45,
                  allow_redirects=False,
              )
              if response.status_code >= 400:
                  message = response.text[:1000]
                  raise RuntimeError(f"Kaggle {method} returned HTTP {response.status_code}: {message}")
              return response

          print("Getting the saved notebook version.")
          meta_response = post("GetKernel", {
              "userName": owner,
              "kernelSlug": slug,
          })
          try:
              meta = meta_response.json()
          except ValueError:
              raise RuntimeError("Kaggle GetKernel returned a non-JSON response.")
          metadata = meta.get("metadata", {}) if isinstance(meta, dict) else {}
          version = metadata.get("currentVersionNumber") or metadata.get("current_version_number")
          if not version:
              blob = json.dumps(meta)
              found = re.search(r'"currentVersionNumber"\s*:\s*(\d+)', blob)
              version = int(found.group(1)) if found else None
          if not version:
              raise RuntimeError(f"Could not determine the notebook output version. Response keys: {list(meta) if isinstance(meta, dict) else type(meta).__name__}")
          version = int(version)
          print(f"Requesting only musetalk_preview.mp4 from notebook version {version}.")

          output_response = post("DownloadKernelOutput", {
              "ownerSlug": owner,
              "kernelSlug": slug,
              "filePath": "musetalk_preview.mp4",
              "versionNumber": version,
          })

          download_url = output_response.headers.get("Location")
          if not download_url:
              try:
                  body = output_response.json()
              except ValueError:
                  body = {}
              if isinstance(body, dict):
                  download_url = body.get("url") or body.get("downloadUrl") or body.get("download_url")
          if not download_url:
              raise RuntimeError(f"Kaggle did not return a redirect URL for the file (HTTP {output_response.status_code}).")

          print("Kaggle returned a signed file location; retrieving the MP4.")
          file_response = session.get(download_url, timeout=120, stream=True)
          file_response.raise_for_status()
          output_path = pathlib.Path("recovered-preview/musetalk_preview.mp4")
          with output_path.open("wb") as handle:
              for chunk in file_response.iter_content(chunk_size=1024 * 1024):
                  if chunk:
                      handle.write(chunk)
          size = output_path.stat().st_size
          if size < 100_000:
              raise RuntimeError(f"Downloaded output is unexpectedly small ({size} bytes).")

          media = av.open(str(output_path))
          streams = {stream.type for stream in media.streams}
          duration = float(media.duration) / av.time_base if media.duration else 0.0
          if not {"video", "audio"}.issubset(streams):
              raise RuntimeError(f"Output did not contain both audio and video streams: {sorted(streams)}.")
          if not expected - 1.5 <= duration <= expected + 3.0:
              raise RuntimeError(f"Unexpected preview duration {duration:.3f}s.")
          video = next(stream for stream in media.streams if stream.type == "video")
          audio = next(stream for stream in media.streams if stream.type == "audio")
          summary = {
              "file": output_path.name,
              "bytes": size,
              "duration_seconds": round(duration, 3),
              "streams": sorted(streams),
              "video_codec": video.codec_context.name,
              "audio_codec": audio.codec_context.name,
              "resolution": f"{video.width}x{video.height}",
              "source_kernel": f"{owner}/{slug}",
              "source_version": version,
          }
          pathlib.Path("recovered-preview/preview-summary.json").write_text(json.dumps(summary, indent=2))
          print(json.dumps(summary, indent=2))
          PY
      - name: Preserve the private preview for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: muse-talk-private-quality-preview
          path: recovered-preview/
          if-no-files-found: ignore
          retention-days: 7
      - name: Write recovery summary
        if: always()
        run: |
          {
            echo "## MuseTalk completed preview recovery"
            echo "The private rendered MP4 is downloaded from the exact notebook output."
          } >> "$GITHUB_STEP_SUMMARY"
