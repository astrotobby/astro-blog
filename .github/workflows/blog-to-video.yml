name: blog-to-video

# Fires when a new/edited post lands in the posts dir. Adjust paths to match
# config.yaml -> posts_dir. Also runnable on-demand from the Actions tab.
on:
  # Turn EVERY article that goes live on the blog into a video, no matter how it got
  # there. Two complementary triggers, both of which run a --sweep (which processes
  # every live post whose slug isn't already in the dedup ledger, exactly once):
  #   1. push  — fires immediately when any commit touches the content dir (a Make.com
  #      scenario, the scheduled-publisher, or a manual commit). Immediate coverage.
  #   2. schedule — a periodic safety net that catches anything the push trigger
  #      missed (a push that didn't fire, a post added out-of-band, a backfill, a run
  #      that errored). This is what guarantees "any article that goes live becomes a
  #      video, regardless of source" even when no qualifying push event happened.
  # The primed ledger + slug/title dedup mean a scheduled sweep NEVER re-posts existing
  # posts or publishes a backlog on its own clock — it only ever picks up genuinely-new
  # live posts.
  push:
    branches: [main, master]
    paths:
      - "src/content/blog/**"
      - "posts/**"
  schedule:
    # Every 3 hours. The sweep is a cheap no-op when there's nothing new (it just
    # parses front-matter and checks the ledger), so a frequent cadence keeps the
    # "every live post → video" guarantee tight without cost.
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "latest | dry"
        default: "latest"
      force:
        description: "repost even if already posted (true | false)"
        default: "false"
      sweep:
        description: "process EVERY live post not in the ledger (manual; prime first!)"
        default: "false"
      prime:
        description: "baseline ledger: mark all current posts done WITHOUT posting"
        default: "false"
      unskip:
        description: "repair ledger: forget skipped-as-duplicate entries first (true | false)"
        default: "false"
      file:
        description: "render THIS post only (repo-relative path, e.g. src/content/blog/x.md)"
        default: ""

permissions:
  contents: write   # needed to publish the video as a Release asset (public URL for Threads)

# 5 Make scenarios can commit near-simultaneously. Serialize runs so they don't
# race on the cached dedup ledger + daily caps. Queue them; never cancel (we must
# not drop a post). One run drains its whole queue of posts before the next starts.
concurrency:
  group: blog-to-video
  cancel-in-progress: false

jobs:
  render-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so before..after always resolves
                           # (shallow depth=2 broke multi-commit pushes -> missed posts)

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python deps
        run:  pip install -r requirements-blog2video.txt

      # Chromium for the Rumble browser-automation poster (no official upload API).
      # Non-fatal: if it fails, only Rumble is skipped; the API posters are unaffected.
      - name: Install Playwright Chromium
        continue-on-error: true
        run: python -m playwright install --with-deps chromium

      # Talking-avatar (Wav2Lip) — non-fatal: if it fails, the pipeline still
      # renders the image montage (the avatar code sees no checkpoint and falls back).
      - name: Set up Wav2Lip avatar
        continue-on-error: true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: bash scripts/setup_wav2lip.sh


      # Persist dedup ledger + per-platform daily caps across runs.
      # restore-keys pulls the most recent prior state; a unique key saves a new one.
      # Split into explicit restore/save (rather than the combined actions/cache@v4)
      # so the save is its own step we control with if: always() — the combined
      # action only saves via a post-job hook, which does not run if this job is
      # hard-cancelled by timeout-minutes, silently losing every ledger update made
      # earlier in that same run (-> those posts look "unposted" again next run and
      # get reprocessed/reposted). An explicit always()-guarded save step is the
      # documented mitigation for that failure mode.
      - name: Restore pipeline state
        uses: actions/cache/restore@v4
        with:
          path: .pipeline/state
          key: blog2video-state-${{ github.run_id }}
          restore-keys: |
            blog2video-state-

      - name: Determine changed posts
        id: diff
        run: |
          CHANGED=""
          if [ "${{ github.event_name }}" = "push" ]; then
            BEFORE="${{ github.event.before }}"
            # If before is missing/zeroes/unreachable (first push, force-push, or a
            # multi-commit push past a shallow clone), fall back to the last commit.
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              CHANGED=$(git diff --name-only HEAD~1 HEAD || true)
            else
              CHANGED=$(git diff --name-only "$BEFORE" "${{ github.sha }}" || true)
            fi
          fi
          echo "changed files:"; echo "$CHANGED"
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGED" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Run pipeline
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          # Accept the correct name OR the earlier mis-typed name (correct wins).
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAN_BOT }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || secrets.TELCHAT_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET || secrets.YOUTUBE_SECRET_KEY }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          TUMBLR_CONSUMER_KEY: ${{ secrets.TUMBLR_CONSUMER_KEY }}
          TUMBLR_CONSUMER_SECRET: ${{ secrets.TUMBLR_CONSUMER_SECRET }}
          TUMBLR_OAUTH_TOKEN: ${{ secrets.TUMBLR_OAUTH_TOKEN }}
          TUMBLR_OAUTH_SECRET: ${{ secrets.TUMBLR_OAUTH_SECRET }}
          TUMBLR_BLOG: ${{ secrets.TUMBLR_BLOG }}
          # X: correct name OR best-guess from your screenshot names (verify if X fails)
          X_API_KEY: ${{ secrets.X_API_KEY || secrets.X_API }}
          X_API_SECRET: ${{ secrets.X_API_SECRET || secrets.CONSUMER_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN || secrets.ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET || secrets.XSECRET_KEY }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          RUMBLE_EMAIL: ${{ secrets.RUMBLE_EMAIL }}
          RUMBLE_PASSWORD: ${{ secrets.RUMBLE_PASSWORD }}
          GH_TOKEN: ${{ github.token }}   # lets gh publish the Release (public video URL)
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
          REDDIT_PASSWORD: ${{ secrets.REDDIT_PASSWORD }}
          # Primary footage provider plus Pixabay fallback. Both values remain GitHub Actions secrets.
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}
        run: |
          FORCE=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then FORCE="--force"; fi
          UNSKIP=""
          if [ "${{ github.event.inputs.unskip }}" = "true" ]; then UNSKIP="--unskip"; fi
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            # Any content push OR the periodic safety-net tick: --sweep processes EVERY
            # live post whose slug isn't already in the dedup ledger, and turns each into
            # a video exactly once. This is source-agnostic on purpose — it does not try
            # to detect "was a file ADDED in this exact push" (that before..after check
            # silently missed posts whenever the push pointer was unreliable: force-push,
            # rebase, or a batch of previously-unpushed commits landing at once). The
            # primed ledger makes the sweep safe on edits-only pushes and on every
            # scheduled tick alike: it simply finds nothing new and exits cleanly — no
            # reposts, no backlog dump. Net effect: every article that goes live on the
            # blog, by ANY route, becomes a video.
            echo "${{ github.event_name }} event -> sweeping for genuinely-new live posts."
            python scripts/run_pipeline.py --sweep $UNSKIP
          elif [ "${{ github.event.inputs.prime }}" = "true" ]; then
            python scripts/run_pipeline.py --prime
          elif [ -n "${{ github.event.inputs.file }}" ]; then
            python scripts/run_pipeline.py --changed "${{ github.event.inputs.file }}" $FORCE $UNSKIP
          elif [ "${{ github.event.inputs.sweep }}" = "true" ]; then
            python scripts/run_pipeline.py --sweep $FORCE $UNSKIP
          elif [ "${{ github.event.inputs.mode }}" = "dry" ]; then
            python scripts/run_pipeline.py --latest --dry-run $FORCE
          else
            python scripts/run_pipeline.py --latest $FORCE $UNSKIP
          fi

      # if: always() so this still runs (and the ledger is still persisted) even
      # if the pipeline step above failed or a post errored out — the only case
      # it can't run is a hard timeout-cancellation of the whole job, which the
      # per-run post cap (MAX_POSTS_PER_RUN in run_pipeline.py) + the 60-minute
      # budget above are sized to avoid in normal operation.
      - name: Save pipeline state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .pipeline/state
          key: blog2video-state-${{ github.run_id }}

      - name: Upload rendered videos as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-videos
          path: |
            .pipeline/out/video_*.mp4
            .pipeline/out/rumble_fail_*.png
            .pipeline/results.json
          if-no-files-found: ignore
          retention-days: 7
