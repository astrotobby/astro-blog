name: make-thumbnails

# Manual: generate + set catchy thumbnails for published YouTube videos.
# Optional input "only" = a single video id to (re)thumbnail.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "single video id (blank = all uploads)"
        default: ""

permissions:
  contents: read

jobs:
  thumbs:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install Pillow requests google-api-python-client google-auth
      - name: Make + set thumbnails
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET || secrets.YOUTUBE_SECRET_KEY }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.only }}" ]; then
            python scripts/make_thumbnails.py --only ${{ github.event.inputs.only }}
          else
            python scripts/make_thumbnails.py
          fi
      - name: Upload generated thumbnails as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thumbnails
          path: .pipeline/thumbs/*.jpg
          if-no-files-found: ignore
