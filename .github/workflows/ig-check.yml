name: ig-check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore pipeline state (for the refreshed IG token)
        uses: actions/cache@v4
        with:
          path: .pipeline/state
          key: igcheck-${{ github.run_id }}
          restore-keys: |
            blog2video-state-
      - name: Check IG media
        env:
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
        run: python scripts/ig_check.py
