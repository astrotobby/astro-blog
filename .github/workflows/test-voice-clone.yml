name: test-voice-clone

# Isolated experiment: build the OpenVoice v2 clone and produce a SAMPLE wav you can
# listen to (downloaded as an artifact). Does NOT touch the live pipeline.
on:
  workflow_dispatch:
    inputs:
      text:
        description: "sample sentence to speak in the cloned voice"
        default: "Here's what nobody tells you about AI agents in 2026. This is my cloned voice, generated for free."

permissions:
  contents: read

jobs:
  clone:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install torch (CPU)
        run: pip install torch==2.2.2 torchaudio==2.2.2 --index-url https://download.pytorch.org/whl/cpu
      - name: Install reference downloader
        run: pip install yt-dlp
      - name: Set up OpenVoice
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: bash scripts/setup_openvoice.sh
      - name: Decrypt authorized voice reference
        env:
          VOICE_REFERENCE_KEY: ${{ secrets.VOICE_REFERENCE_KEY }}
        run: |
          test -n "$VOICE_REFERENCE_KEY"
          test -f assets/voice_reference/authorized_reference.mp3.enc
          mkdir -p .pipeline/private_voice
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in assets/voice_reference/authorized_reference.mp3.enc \
            -out .pipeline/private_voice/authorized_reference.mp3 \
            -pass env:VOICE_REFERENCE_KEY
          chmod 600 .pipeline/private_voice/authorized_reference.mp3

      - name: Generate cloned sample
        run: python scripts/voice_clone.py "${{ github.event.inputs.text }}" cloned_sample.wav
      - name: Remove private voice material
        if: always()
        run: rm -rf .pipeline/private_voice
      - name: Upload cloned sample
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloned-voice-sample
          path: |
            cloned_sample.wav
          if-no-files-found: error
