name: Publish AI-GEMS long-form videos to Facebook Instagram and Rumble

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Check pending handoffs and destination credentials without publishing"
        type: boolean
        required: true
        default: true
      limit:
        description: "Maximum handoffs to process in this run"
        type: number
        required: true
        default: 4

permissions:
  contents: write

# Share the existing blog-to-video cache and serialize with its publisher. This prevents
# races on the Rumble rolling session, token refresh state, and per-destination ledger.
concurrency:
  group: blog-to-video
  cancel-in-progress: false

jobs:
  publish-social:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
      RUMBLE_EMAIL: ${{ secrets.RUMBLE_EMAIL }}
      RUMBLE_PASSWORD: ${{ secrets.RUMBLE_PASSWORD }}
      RUMBLE_STORAGE_STATE: ${{ secrets.RUMBLE_STORAGE_STATE }}
      GH_TOKEN: ${{ github.token }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
      RUN_LIMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.limit || 4 }}

    steps:
      - name: Checkout astro-blog social publisher
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install social publisher dependencies
        run: python -m pip install --disable-pip-version-check requests PyYAML pynacl playwright

      - name: Install Chromium for Rumble browser publishing
        if: env.DRY_RUN != 'true'
        run: python -m playwright install --with-deps chromium

      - name: Restore existing blog-to-video state
        uses: actions/cache/restore@v4
        with:
          path: .pipeline/state
          key: blog2video-state-${{ github.run_id }}
          restore-keys: |
            blog2video-state-

      - name: Publish pending long-form videos to Facebook Instagram and Rumble
        run: |
          set -euo pipefail
          ARGS=(--limit "$RUN_LIMIT")
          if [ "$DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi
          python scripts/longform_social_bridge.py "${ARGS[@]}"

      - name: Save social tokens, Rumble session and post ledger
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .pipeline/state
          key: blog2video-state-${{ github.run_id }}

