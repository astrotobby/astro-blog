name: Publish AI-GEMS long-form videos to Facebook Instagram and Rumble

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Check pending handoffs and destination credentials without publishing"
        type: boolean
        required: true
        default: true
      check_destinations:
        description: "Validate configured Facebook, Instagram and Rumble credentials without posting"
        type: boolean
        required: true
        default: false
      limit:
        description: "Maximum handoffs to process in this run"
        type: number
        required: true
        default: 4

permissions:
  contents: write

# Share the existing blog-to-video cache and serialize with its publisher. This prevents
# races on the Rumble rolling session, token refresh state, and per-destination ledger.
concurrency:
  group: blog-to-video
  cancel-in-progress: false

jobs:
  publish-social:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
      RUMBLE_EMAIL: ${{ secrets.RUMBLE_EMAIL }}
      RUMBLE_PASSWORD: ${{ secrets.RUMBLE_PASSWORD }}
      RUMBLE_STORAGE_STATE: ${{ secrets.RUMBLE_STORAGE_STATE }}
      GH_TOKEN: ${{ github.token }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
      RUN_LIMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.limit || 4 }}
      CHECK_DESTINATIONS: ${{ github.event_name == 'workflow_dispatch' && inputs.check_destinations || false }}

    steps:
      - name: Checkout astro-blog social publisher
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install social publisher dependencies
        run: python -m pip install --disable-pip-version-check requests PyYAML pynacl

      - name: Restore existing blog-to-video state
        uses: actions/cache/restore@v4
        with:
          path: .pipeline/state
          key: blog2video-state-${{ github.run_id }}
          restore-keys: |
            blog2video-state-

      - name: Detect ready social handoffs
        id: pending
        run: |
          set -euo pipefail
          READY="$(python scripts/longform_social_bridge.py --has-pending)"
          case "$READY" in true|false) ;; *) echo "Unexpected readiness response: $READY"; exit 1 ;; esac
          echo "has_pending=$READY" >> "$GITHUB_OUTPUT"

      - name: Install FFmpeg only when a live social upload is pending
        if: env.DRY_RUN != 'true' && env.CHECK_DESTINATIONS != 'true' && steps.pending.outputs.has_pending == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Publish pending long-form videos to Facebook Instagram and Rumble
        run: |
          set -euo pipefail
          ARGS=(--limit "$RUN_LIMIT")
          if [ "$CHECK_DESTINATIONS" = "true" ]; then
            ARGS+=(--check-destinations)
          elif [ "$DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          python scripts/longform_social_bridge.py "${ARGS[@]}"

      - name: Upload Rumble owner-confirmation packets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rumble-owner-handoffs-${{ github.run_id }}
          path: .pipeline/out/rumble_handoff_*.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Add Rumble owner tasks to the workflow summary
        if: always()
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, json
          files = sorted(glob.glob(".pipeline/out/rumble_handoff_*.json"))
          if not files:
              print("### Rumble")
              print("No new Rumble owner handoff was generated in this run.")
          for name in files:
              with open(name, encoding="utf-8") as handle:
                  item = json.load(handle)
              print(f"### Rumble handoff — {item.get('source_channel_title', 'channel')}")
              print()
              print(f"- **Video:** {item.get('title', 'Untitled')}")
              print(f"- **Category:** {item.get('primary_category')} | **Visibility:** {item.get('visibility')}")
              print(f"- **[Download the video]({item.get('video_download_url')})**")
              print(f"- **[Open Rumble upload]({item.get('upload_page')})**")
              print("- **Owner action:** choose the appropriate license, personally review and confirm Rumble rights/terms, then submit.")
              print()
          PY

      - name: Save social tokens, Rumble session and post ledger
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .pipeline/state
          key: blog2video-state-${{ github.run_id }}

