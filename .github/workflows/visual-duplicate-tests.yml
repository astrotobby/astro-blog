name: Visual duplicate guard tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/generate_video.py
      - scripts/build_script.py
      - scripts/seed_footage_history.py
      - scripts/longform_social_relay.py
      - scripts/platforms.py
      - scripts/longform_social_bridge.py
      - scripts/test_longform_social_bridge.py
      - scripts/crosspost_longform.py
      - scripts/test_crosspost_longform.py
      - scripts/create_longform_social_release.py
      - scripts/longform_pipeline.py
      - .github/workflows/longform-social-bridge.yml
      - .github/workflows/longform-social-poller.yml
      - .github/workflows/longform-social-relay.yml
      - scripts/test_video_pipeline.py
      - scripts/test_longform_social_relay.py
      - .github/workflows/visual-duplicate-tests.yml
  pull_request:
    paths:
      - scripts/generate_video.py
      - scripts/build_script.py
      - scripts/seed_footage_history.py
      - scripts/longform_social_relay.py
      - scripts/longform_social_bridge.py
      - scripts/platforms.py
      - scripts/test_video_pipeline.py
      - scripts/test_longform_social_relay.py
      - scripts/test_longform_social_bridge.py
      - scripts/crosspost_longform.py
      - scripts/test_crosspost_longform.py
      - scripts/create_longform_social_release.py
      - scripts/longform_pipeline.py
      - .github/workflows/longform-social-bridge.yml
      - .github/workflows/longform-social-poller.yml
      - .github/workflows/longform-social-relay.yml
      - .github/workflows/visual-duplicate-tests.yml

permissions:
  contents: read

jobs:
  visual-duplicate-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg and minimal test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check requests PyYAML Pillow

      - name: Compile changed visual pipeline modules
        run: |
          python -m py_compile scripts/generate_video.py scripts/build_script.py scripts/seed_footage_history.py scripts/longform_social_relay.py scripts/longform_social_bridge.py scripts/crosspost_longform.py scripts/create_longform_social_release.py scripts/platforms.py scripts/test_longform_social_bridge.py scripts/test_longform_social_relay.py scripts/test_crosspost_longform.py scripts/longform_pipeline.py

      - name: Run visual and video pipeline regression tests
        run: python -m unittest scripts/test_video_pipeline.py scripts/test_longform_social_relay.py scripts/test_longform_social_bridge.py scripts/test_crosspost_longform.py -v
