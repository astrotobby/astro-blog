name: Visual duplicate guard tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-duplicate-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install minimal test dependencies
        run: python -m pip install --disable-pip-version-check requests PyYAML Pillow

      - name: Compile changed visual pipeline modules
        run: |
          python -m py_compile scripts/generate_video.py scripts/build_script.py scripts/seed_footage_history.py

      - name: Run visual and video pipeline regression tests
        run: python -m unittest scripts/test_video_pipeline.py -v
