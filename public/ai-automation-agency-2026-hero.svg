<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="How to start an AI automation agency in 2026">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141a3a"/>
      <stop offset="0.55" stop-color="#1b1550"/>
      <stop offset="1" stop-color="#0b0e1f"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.18" cy="0.22" r="0.6">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.9" cy="0.85" r="0.6">
      <stop offset="0" stop-color="#EC4899" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glowA)"/>
  <rect width="1200" height="630" fill="url(#glowB)"/>

  <!-- faint grid -->
  <g stroke="#8B93FF" stroke-opacity="0.06" stroke-width="1">
    <path d="M0 90 H1200 M0 180 H1200 M0 270 H1200 M0 360 H1200 M0 450 H1200 M0 540 H1200"/>
    <path d="M120 0 V630 M240 0 V630 M360 0 V630 M480 0 V630 M600 0 V630 M720 0 V630 M840 0 V630 M960 0 V630 M1080 0 V630"/>
  </g>

  <!-- eyebrow -->
  <text x="80" y="86" font-family="Arial, Helvetica, sans-serif" font-size="20" letter-spacing="5" fill="#C7D2FE" fill-opacity="0.85">ASTRO TOBBY · 2026 PLAYBOOK</text>

  <!-- agent network -->
  <g>
    <g stroke="#A5B4FC" stroke-opacity="0.5" stroke-width="2" fill="none">
      <path d="M150 300 L300 200"/>
      <path d="M150 300 L300 400"/>
      <path d="M300 200 L470 250"/>
      <path d="M300 400 L470 250"/>
      <path d="M300 400 L300 200"/>
      <path d="M470 250 L640 300"/>
    </g>
    <!-- orchestrator -->
    <circle cx="150" cy="300" r="34" fill="#6366F1"/>
    <circle cx="150" cy="300" r="34" fill="#6366F1" filter="url(#soft)" opacity="0.7"/>
    <text x="150" y="307" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#fff">AI</text>
    <!-- agent nodes -->
    <circle cx="300" cy="200" r="22" fill="#22D3EE"/>
    <circle cx="300" cy="400" r="22" fill="#EC4899"/>
    <circle cx="470" cy="250" r="20" fill="#A78BFA"/>
    <circle cx="300" cy="200" r="9" fill="#0b0e1f" opacity="0.35"/>
    <circle cx="300" cy="400" r="9" fill="#0b0e1f" opacity="0.35"/>
  </g>

  <!-- revenue chart card -->
  <g transform="translate(620,150)">
    <rect x="0" y="0" width="500" height="330" rx="24" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="30" y="52" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#E5E7EB" font-weight="700">Monthly recurring revenue</text>
    <text x="30" y="82" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#93C5FD">Retainer clients · compounding</text>
    <!-- bars -->
    <g>
      <rect x="40"  y="240" width="46" height="50"  rx="8" fill="url(#bar)" opacity="0.9"/>
      <rect x="115" y="205" width="46" height="85"  rx="8" fill="url(#bar)" opacity="0.9"/>
      <rect x="190" y="165" width="46" height="125" rx="8" fill="url(#bar)" opacity="0.92"/>
      <rect x="265" y="120" width="46" height="170" rx="8" fill="url(#bar)"/>
      <rect x="340" y="70"  width="46" height="220" rx="8" fill="url(#bar)"/>
    </g>
    <!-- trend line -->
    <path d="M63 250 L138 218 L213 178 L288 138 L363 92" fill="none" stroke="#FDE68A" stroke-width="4" stroke-linecap="round"/>
    <circle cx="363" cy="92" r="7" fill="#FDE68A"/>
    <text x="415" y="70" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" fill="#FDE68A">$10K</text>
    <text x="415" y="94" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#FCD34D">/month</text>
  </g>

  <!-- floating pill labels -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#E5E7EB">
    <rect x="150" y="470" width="220" height="46" rx="23" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15"/>
    <text x="176" y="499">⚙ Workflow automation</text>
    <rect x="390" y="470" width="185" height="46" rx="23" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15"/>
    <text x="414" y="499">🤝 Retainer clients</text>
  </g>
</svg>
