<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="Agentic AI Governance 2026 — The Zero-Trust Playbook">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0E1F"/>
      <stop offset="0.55" stop-color="#1B1146"/>
      <stop offset="1" stop-color="#0B0E1F"/>
    </linearGradient>
    <radialGradient id="glowP" cx="0.82" cy="0.2" r="0.7">
      <stop offset="0" stop-color="#EC4899" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowI" cx="0.15" cy="0.85" r="0.7">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#glowP)"/>
  <rect width="1280" height="720" fill="url(#glowI)"/>

  <!-- subtle grid -->
  <g stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1">
    <path d="M0 180 H1280 M0 360 H1280 M0 540 H1280"/>
    <path d="M320 0 V720 M640 0 V720 M960 0 V720"/>
  </g>

  <!-- Right-side motif: shield guarding a mesh of agent nodes -->
  <g transform="translate(940,360)">
    <!-- connection lines -->
    <g stroke="url(#accent)" stroke-opacity="0.55" stroke-width="2">
      <line x1="0" y1="0" x2="-150" y2="-120"/>
      <line x1="0" y1="0" x2="160" y2="-95"/>
      <line x1="0" y1="0" x2="-175" y2="115"/>
      <line x1="0" y1="0" x2="150" y2="140"/>
      <line x1="-150" y1="-120" x2="160" y2="-95"/>
      <line x1="-175" y1="115" x2="150" y2="140"/>
    </g>
    <!-- agent nodes -->
    <g fill="#0B0E1F" stroke="url(#accent)" stroke-width="3">
      <circle cx="-150" cy="-120" r="26"/>
      <circle cx="160" cy="-95" r="26"/>
      <circle cx="-175" cy="115" r="26"/>
      <circle cx="150" cy="140" r="26"/>
    </g>
    <g fill="#C7D2FE" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="middle">
      <text x="-150" y="-113">A</text>
      <text x="160" y="-88">A</text>
      <text x="-175" y="122">A</text>
      <text x="150" y="147">A</text>
    </g>
    <!-- central shield -->
    <path d="M0 -95 L78 -62 V10 C78 66 44 100 0 118 C-44 100 -78 66 -78 10 V-62 Z"
          fill="url(#shield)" stroke="#FDE68A" stroke-opacity="0.25" stroke-width="2"/>
    <!-- lock -->
    <g transform="translate(0,4)" fill="#0B0E1F">
      <rect x="-22" y="-2" width="44" height="34" rx="6"/>
      <path d="M-13 -2 V-14 a13 13 0 0 1 26 0 V-2" fill="none" stroke="#0B0E1F" stroke-width="7"/>
    </g>
    <circle cx="0" cy="10" r="6" fill="#FDE68A"/>
  </g>

  <!-- Eyebrow -->
  <text x="80" y="150" font-family="Arial, Helvetica, sans-serif" font-size="24" letter-spacing="4" fill="#A5B4FC">ASTRO SIGNAL · AGENTIC AI PLAYBOOK</text>

  <!-- Title -->
  <g font-family="Georgia, 'Times New Roman', serif" fill="#FFFFFF" font-weight="700">
    <text x="80" y="270" font-size="82">Agentic AI</text>
    <text x="80" y="360" font-size="82">Governance</text>
    <text x="80" y="450" font-size="82" fill="#F9A8D4">in 2026</text>
  </g>
  <rect x="82" y="482" width="150" height="7" rx="3.5" fill="url(#accent)"/>

  <!-- Subtitle -->
  <text x="82" y="540" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#E0E7FF">The Zero-Trust playbook to keep your AI agents</text>
  <text x="82" y="580" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#E0E7FF">out of Gartner's 40% failure zone.</text>

  <!-- Stat chip -->
  <g transform="translate(82,616)">
    <rect x="0" y="0" width="470" height="58" rx="29" fill="#FFFFFF" fill-opacity="0.06" stroke="#EC4899" stroke-opacity="0.5"/>
    <text x="28" y="38" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#F9A8D4">40%</text>
    <text x="92" y="38" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#E0E7FF">of agent projects cancelled by 2027 — Gartner</text>
  </g>
</svg>
